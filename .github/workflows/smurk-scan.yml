
name: SMURK AI scheduled scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smurk-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out SMURK
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SMURK market scan
        run: python scheduled_scan.py

      - name: Save latest scan to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_snapshot.json data/scan_history.jsonl
          if git diff --cached --quiet; then
            echo "No scan data changes to save."
          else
            git commit -m "Update SMURK scan data"
            git push origin HEAD:main
          fi
